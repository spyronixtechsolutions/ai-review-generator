<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spyronix Review Generator</title>
  <meta name="description" content="Write your Google review in seconds with the Spyronix Review Assistant.">
  <meta name="theme-color" content="#f3752b">
  <link rel="icon" href="https://spyronixtech.in/media/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Soft animated background -->
<div class="bg" aria-hidden="true">
  <span class="blob blob--1"></span>
  <span class="blob blob--2"></span>
  <span class="blob blob--3"></span>
</div>

<main class="wrapper">
  <div class="card">

    <!-- Brand -->
    <header class="hero">
      <img src="https://spyronixtech.in/media/spyronix-logo.png" alt="Spyronix" class="brand-logo" width="64" height="54">
      <p class="eyebrow"><span class="eyebrow__dot"></span>AI review assistant</p>
      <h1>Share your experience <span class="grad-text">in seconds</span></h1>
      <p class="lede">Tell us your treatment, pick a style, and we’ll draft a review you can post on Google.</p>
    </header>

    <div class="form-group">
      <!-- Clinic/Hospital (Set automatically from URL) -->
      <label class="field">
        <span class="field__label">Clinic / Hospital</span>
        <span class="field__control field__control--icon field__control--clinic">
          <input type="text" id="doctor" placeholder="Clinic/Hospital Name" readonly>
        </span>
      </label>

      <!-- Locations will be added dynamically via script.js -->
      <label class="field">
        <span class="field__label">Branch</span>
        <span class="field__control field__control--icon field__control--pin">
          <select id="location"></select>
        </span>
      </label>

      <!-- Treatment -->
      <label class="field">
        <span class="field__label">Treatment received</span>
        <span class="field__control field__control--icon field__control--spark">
          <input type="text" id="treatment" placeholder="e.g. Cataract surgery, eye check-up" autocomplete="off">
        </span>
      </label>
    </div>

    <!-- Review Settings Row -->
    <div class="row">
      <label class="field input-col">
        <span class="field__label">Review length</span>
        <span class="field__control">
          <select id="length">
            <option value="short">Short Review</option>
            <option value="long">Detailed Review</option>
          </select>
        </span>
      </label>

      <label class="field input-col">
        <span class="field__label">Language</span>
        <span class="field__control">
          <select id="language">
            <option value="English">English</option>
            <option value="Hindi">Hindi</option>
            <option value="Marathi">Marathi</option>
          </select>
        </span>
      </label>
    </div>

    <!-- Generate Button -->
    <button class="generate-btn" onclick="generateReview()">
      Generate Review
    </button>

    <!-- Loading State -->
    <div id="loading" class="loading hidden" role="status" aria-live="polite">
      <div class="loading__row">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Crafting your perfect review...</span>
      </div>
      <div class="skeleton" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>

    <!-- Output Container -->
    <div id="reviews" class="reviews-container" aria-live="polite"></div>

    <!-- Spyronix Footer -->
    <footer class="footer">
      Made with <span class="heart" aria-label="love">♥</span> by <a href="https://spyronixtech.in/" target="_blank" rel="noopener">Spyronix</a>
    </footer>

  </div>
</main>

<script src="script.js"></script>

</body>
</html>
