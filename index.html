<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spyronix Review Generator</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div class="wrapper">
  <div class="card fade-in-up">
    
    <!-- Brand Logo -->
    <div class="logo-container">
      <img src="https://spyronixtech.in/wp-content/uploads/2026/06/cropped-Untitled-design-66.png" alt="Spyronix Logo" class="brand-logo">
    </div>

    <h1>✨ Spyronix Review Assistant</h1>

    <div class="form-group">
      <!-- Clinic/Hospital (Set automatically from URL) -->
      <input 
        type="text" 
        id="doctor" 
        placeholder="Clinic/Hospital Name" 
        readonly
      >

      <!-- Locations will be added dynamically via script.js -->
      <select id="location"></select>

      <!-- Treatment -->
      <input 
        type="text" 
        id="treatment" 
        placeholder="Treatment Received (Keyword)"
      >
    </div>

    <!-- Review Settings Row -->
    <div class="row">
      <div class="input-col">
        <select id="length">
          <option value="short">Short Review</option>
          <option value="long">Detailed Review</option>
        </select>
      </div>

      <div class="input-col">
        <select id="language">
          <option value="English">English</option>
          <option value="Hindi">Hindi</option>
          <option value="Marathi">Marathi</option>
        </select>
      </div>
    </div>

    <!-- Generate Button -->
    <button class="generate-btn" onclick="generateReview()">
      Generate Review
    </button>

<!-- Loading State -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <span>Crafting your perfect review...</span>
    </div>

    <!-- Output Container -->
    <div id="reviews" class="reviews-container"></div>

    <!-- Spyronix Footer -->
    <div class="footer">
      Made with Love by <a href="https://spyronixtech.in/" target="_blank">Spyronix</a>
    </div>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
